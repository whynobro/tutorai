<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TutorAI fixture</title>
    <style>
      body { max-width: 720px; margin: 48px auto; padding: 0 24px; color: #202124; font-family: Arial, sans-serif; }
      fieldset { display: grid; gap: 8px; border: 0; padding: 0; }
      label { padding: 12px; border: 1px solid #ddd; border-radius: 6px; }
      label:has(input:checked) { border-color: #555; background: #f2f2f2; }
    </style>
  </head>
  <body>
    <main>
      <h1>Algebra Practice</h1>
      <fieldset>
        <legend><h2>Which expression is equivalent to 3(x + 4)?</h2></legend>
        <label><input type="radio" name="answer" /> 3x + 4</label>
        <label><input type="radio" name="answer" /> 3x + 12</label>
        <label><input type="radio" name="answer" /> x + 12</label>
        <label><input type="radio" name="answer" /> 7x</label>
      </fieldset>
    </main>
  </body>
</html>
